<header class="navbar">
  <div class="contenido">
    <a routerLink="/publicaciones" class="marca">
      <img src="favicon.svg" alt="" width="32" height="32" />
      FICHINES
    </a>

    <nav>
      <a routerLink="/publicaciones" routerLinkActive="activo">Salón</a>
      <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
      <!-- *appSoloAdmin: directiva estructural propia -->
      <a *appSoloAdmin routerLink="/panel" routerLinkActive="activo">Mostrador</a>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    </nav>

    <!-- Foto, nick y vidas del jugador -->
    @if (auth.usuarioActual(); as usuario) {
      <div class="jugador">
        @if (usuario.imagenUrl) {
          <img class="mini-foto" appImagenRespaldo [src]="usuario.imagenUrl" alt="" />
        } @else {
          <span class="mini-foto">{{ usuario.nombre.charAt(0) }}</span>
        }
        <div>
          <span class="nick">P1 &#64;{{ usuario.usuario }}</span>
          <span class="vidas" aria-label="3 vidas">&#9829;&#9829;&#9829;</span>
        </div>
      </div>
    }
  </div>
</header>
