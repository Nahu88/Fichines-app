@if (modal.abierto()) {
  <!-- Clic en el fondo: se cierra -->
  <div class="fondo" (click)="modal.cerrar()">
    <!-- stopPropagation: el clic en la caja no llega al fondo -->
    <div class="caja hud" [class.error]="modal.tipo() === 'error'" role="dialog" aria-modal="true"
         [attr.aria-label]="modal.titulo()" (click)="$event.stopPropagation()">
      @if (modal.alConfirmar()) {
        <!-- Confirmación -->
        <p class="icono">¿CONTINUAR?</p>
        <h2>{{ modal.titulo() }}</h2>
        <p>{{ modal.mensaje() }}</p>
        <div class="botones">
          <button class="boton-secundario" type="button" (click)="modal.cerrar()">Cancelar</button>
          <button class="boton" type="button" (click)="modal.aceptar()">{{ modal.textoConfirmar() }}</button>
        </div>
      } @else {
        <!-- Aviso común -->
        <p class="icono">{{ modal.tipo() === 'error' ? 'GAME OVER' : 'NIVEL SUPERADO' }}</p>
        <h2>{{ modal.titulo() }}</h2>
        <p>{{ modal.mensaje() }}</p>
        <button class="boton" type="button" (click)="modal.cerrar()">OK</button>
      }
      <span class="siguiente parpadeo" aria-hidden="true">&#9660;</span>
    </div>
  </div>
}
