@if (modal.abierto()) {
  <!-- Fondo oscuro: si hacés clic afuera de la caja, se cierra -->
  <div class="fondo" (click)="modal.cerrar()">
    <!-- stopPropagation evita que el clic dentro de la caja llegue al fondo -->
    <div class="caja hud" [class.error]="modal.tipo() === 'error'" role="dialog" aria-modal="true"
         [attr.aria-label]="modal.titulo()" (click)="$event.stopPropagation()">
      <h2>{{ modal.titulo() }}</h2>
      <p>{{ modal.mensaje() }}</p>
      <button class="boton" type="button" (click)="modal.cerrar()">Entendido</button>
    </div>
  </div>
}
